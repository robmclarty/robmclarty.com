<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build with AI, stay in charge</title>
<meta name="description" content="A toolchain where people make the decisions and machines do the checking. A slide deck by Rob McLarty, November 2026.">
<meta name="author" content="Rob McLarty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F1; --ink:#16233B; --ink2:#46546B; --rule:#C9D1CC;
  --red:#D7263D; --green:#2E8B57; --yellow:#F4B400; --blue:#3A7CA5;
  --soil:#E6D2BA; --brown:#8A5532; --ice:#D3EAF4; --plum:#7D4E7E; --plumtint:#EDE3EC;
  --display:'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --body:'Figtree', 'Avenir Next', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#DDE3DE;color:var(--ink);font-family:var(--body)}
body{overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.deck{width:1600px;height:900px;flex:none;position:relative;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--paper);display:none;overflow:hidden;
  box-shadow:0 2px 0 rgba(22,35,59,.08)}
.slide.on{display:block}
.slide svg text{font-family:var(--body)}
.slide svg .mono{font-family:var(--mono)}
.slide svg .disp{font-family:var(--display)}

/* shared type */
.kid{font-family:var(--display);font-weight:800;font-size:56px;line-height:1.04;letter-spacing:-.01em;margin:0;max-width:700px}
.kid.small{font-size:46px}
.lede{font-size:24px;line-height:1.42;color:var(--ink2);max-width:700px;margin:18px 0 0}
.where{display:flex;align-items:center;gap:12px;font-size:20px;color:var(--ink2);margin-bottom:18px}
.where b{font-family:var(--display);font-weight:800;font-size:30px;color:var(--ink);letter-spacing:-.01em}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
code,.code,pre,.mono{font-family:var(--mono);font-size:.86em;font-variant-ligatures:none}
.slide svg .mono{font-variant-ligatures:none}
pre{font-family:var(--mono);font-size:15px;line-height:1.5;margin:0;white-space:pre;background:#fff;
  border:2px solid var(--ink);border-radius:6px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink)}

/* tool slide */
.tool .left{position:absolute;left:72px;top:60px;width:860px}
.tool .pic{position:absolute;left:40px;top:372px;width:900px;height:470px}
.tool .hood{position:absolute;right:0;top:0;bottom:0;width:640px;background:#E6ECEF;
  border-left:3px solid var(--ink);padding:38px 44px 26px 40px;font-size:16.5px;line-height:1.42;overflow:hidden;display:flex;flex-direction:column}
.hood>*{flex:none}
.hood .shotlink{display:block;margin:4px 0 8px;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);background:#fff;flex:0 1 auto;min-height:120px}
.hood .shotlink img{display:block;width:100%;height:auto}
.hood .shotlink:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hood .cap{font-size:15.5px;line-height:1.4;margin:6px 0 0}
.hood .how{font-size:13.5px;color:var(--ink2);margin:4px 0 0}
.hood .repo{margin-top:12px;font-size:14px;align-self:flex-start}
.hood .stand{font-size:15px;line-height:1.45;margin:12px 0 0}
.hood h3{font-family:var(--display);font-weight:600;font-size:19px;margin:16px 0 5px;color:var(--ink)}
.hood h3:first-of-type{margin-top:0}
.hood p{margin:0}
.hood ul{margin:0;padding-left:20px}
.hood li{margin:2px 0}
.hood .title{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 18px;display:flex;justify-content:space-between;align-items:baseline}
.hood .title span{font-family:var(--body);font-weight:400;font-size:16px;color:var(--ink2)}
.hood pre{font-size:13.5px;padding:9px 12px;box-shadow:3px 3px 0 var(--ink)}
.state{display:inline-block;padding:1px 10px;border-radius:999px;border:2px solid var(--ink);font-size:15px;font-weight:700;margin-right:6px}
.state.shipped{background:#BFE3CC}.state.built{background:#FBE7A6}.state.specced{background:#fff}
.minimap{position:absolute;left:790px;top:66px}

.repo{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:9px 16px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;
  font-family:var(--mono);font-size:15px;color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.repo:hover,.repo:focus-visible{background:var(--lblue,#BFD9EA);outline:none}
.repo.private{box-shadow:none;border-style:dashed;color:var(--ink2);background:transparent}
.hood .gh{font-family:var(--mono);font-size:14px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
/* flow slide */
.flowgrid{display:grid;grid-template-columns:auto 1fr;gap:20px;margin-top:20px;align-items:start}
.codewin{border:2.5px solid var(--ink);border-radius:8px;background:#fff;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.codewin .tab{font-family:var(--mono);font-size:13px;font-weight:600;padding:6px 12px;background:#E6ECEF;border-bottom:2px solid var(--ink)}
.codewin .tab span{font-family:var(--body);font-weight:400;color:var(--ink2);margin-left:8px}
pre.hl{border:0;box-shadow:none;border-radius:0;margin:0;padding:12px 14px;font-size:12.25px;line-height:1.36;color:var(--ink);background:#fff}
.hl .n,.legend .n{background:#FBE7A6;border-radius:3px;padding:0 2px;font-weight:600;color:var(--ink)}
.hl .f,.legend .f{color:#2F6E96;font-weight:600}
.hl .m,.legend .m{color:#8A4A12;font-weight:600;text-decoration:underline;text-decoration-color:#F4B400;text-decoration-thickness:2px;text-underline-offset:2px}
.hl .k{color:#7D4E7E}
.hl .t{color:#2E7D52}
.hl .s{color:#8A5532}
.hl .d,.legend .d{color:#6E5A3C;font-style:italic}
.hl .p{color:#46546B}
.hl .c,.hl .g{color:#8A94A3}
.hl .nm{color:#B5462F}
.hl .fn{color:var(--ink);font-weight:700}
.legend{margin-top:18px;font-size:16px;line-height:1.5;display:grid;gap:6px}
.legend span{font-family:var(--mono);font-size:13.5px;margin-right:8px}
/* plugs slide */
.plugs{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 38px;margin-top:30px}
.plug{display:flex;gap:14px;align-items:flex-start}
.plug>svg{flex:none}
.plug h3{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.1;margin:2px 0 6px}
.plug .pw{font-size:16.5px;line-height:1.38;margin:0 0 8px;color:var(--ink)}
.plug .pc code{font-size:13.5px;background:#fff;border:1.5px solid var(--rule);border-radius:4px;padding:1px 6px}
.plug .pf{font-size:15px;color:var(--ink2);margin:7px 0 7px}
.plug .pf b{color:var(--ink)}
.plug .arr{margin:0 7px;color:var(--ink)}
.plugs.big{margin-top:44px;gap:46px 44px}
.plugs.big .plug h3{font-size:27px}
.plugs.big .pw{font-size:19.5px}
.plugs.big .pc code{font-size:15.5px}
.plugs.big .pf{font-size:17px}
/* footer */
.apx{position:absolute;left:72px;top:26px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.foot{position:absolute;left:72px;bottom:22px;font-size:14px;color:var(--ink2)}
.num{position:absolute;right:28px;bottom:20px;font-family:var(--display);font-size:16px;color:var(--ink2)}
.tool .num{right:660px}

/* generic layouts */
.pad{position:absolute;inset:64px 72px 60px 72px}
.h1{font-family:var(--display);font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-.02em;margin:0;max-width:1200px}
.h2{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.015em;margin:0;max-width:1300px}
.sub{font-size:23px;line-height:1.45;color:var(--ink2);max-width:1100px;margin:14px 0 0}
.cols{display:grid;gap:36px}
.tbl{width:100%;border-collapse:collapse;font-size:17px;line-height:1.35}
.tbl th{font-family:var(--display);font-weight:600;text-align:left;font-size:17px;padding:8px 10px;border-bottom:3px solid var(--ink)}
.tbl td{padding:8px 10px;border-bottom:1.5px solid var(--rule);vertical-align:top}
.tbl td:first-child{font-weight:700;white-space:nowrap}
.note{font-size:16px;color:var(--ink2)}

/* title slide */
.cover .big{font-family:var(--display);font-weight:800;font-size:132px;line-height:.92;letter-spacing:-.02em;margin:0}
/* nav help */
.help{position:fixed;left:12px;bottom:10px;font-size:12px;color:#6B7684;font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){ .slide.on .reveal{animation:rise .5s ease-out both} }
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{background:none;overflow:visible;height:auto}
  .viewport{position:static;display:block}
  .deck{transform:none!important;width:1600px;height:auto}
  .slide{display:block!important;position:relative;width:1600px;height:900px;page-break-after:always;box-shadow:none}
  .help{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16233B"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D7263D"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A7CA5"/></marker>
  </defs>
</svg>
<div class="viewport"><div class="deck" id="deck"></div></div>
<div class="help">← → or space to move · F for full screen · print to save a PDF</div>
<script>
/* ------------------------------------------------------------------
   Drawing kit. Every shape is drawn twice: a flat fill nudged down
   and right, then the ink outline on top (a two-colour print look).
   Colour carries meaning everywhere in the deck:
     red = a person decides, green = the checks pass,
     yellow = an agent is working, blue = a contract file.
------------------------------------------------------------------- */
const C={ink:'#16233B',ink2:'#46546B',paper:'#F2F5F1',red:'#D7263D',green:'#2E8B57',yellow:'#F4B400',blue:'#3A7CA5',
  soil:'#E6D2BA',brown:'#8A5532',ice:'#D3EAF4',plum:'#7D4E7E',plumtint:'#EDE3EC',white:'#FFFFFF',grey:'#C9D1CC',
  lgreen:'#BFE3CC',lyellow:'#FBE7A6',lblue:'#BFD9EA',lred:'#F5C2C8',cyan:'#7FD4E0'};
const R=(shape,fill,d=4,sw=3)=>`<g transform="translate(${d} ${d})" fill="${fill}" stroke="none">${shape}</g><g fill="none" stroke="${C.ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">${shape}</g>`;
const L=(shape,col=C.ink,sw=3,extra='')=>`<g fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${extra}>${shape}</g>`;
const T=(x,y,s,o={})=>{const a=o.a||'start',z=o.z||18,w=o.w||400,c=o.c||C.ink,cls=o.cls||'',st=o.style||'';
  return `<text x="${x}" y="${y}" text-anchor="${a}" font-size="${z}" font-weight="${w}" fill="${c}" class="${cls}" style="${st}">${s}</text>`;};
const TW=(x,y,s,o={})=>{const z=o.z||18,max=Math.floor((o.maxw||(890-x))/(z*.5));const words=s.split(' ');const lines=[];let l='';
  for(const w of words){if((l+' '+w).trim().length>max){lines.push(l.trim());l=w;}else l+=' '+w;} if(l.trim())lines.push(l.trim());
  return lines.map((ln,i)=>T(x,y+i*z*1.35,ln,o)).join('');};
const box=(x,y,w,h,label,fill=C.white,o={})=>R(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??10}"/>`,fill,o.d??4,o.sw??3)+
  (label?T(x+w/2,y+h/2+(o.z||18)*.36,label,{a:'middle',z:o.z||18,w:o.w||700,cls:o.cls||''}):'');
const arrow=(x1,y1,x2,y2,col='ink',o={})=>{const m={ink:'ah',red:'ahr',green:'ahg',blue:'ahb'}[col];
  return `<path d="${o.d||`M${x1} ${y1} L${x2} ${y2}`}" fill="none" stroke="${C[col]}" stroke-width="${o.sw||3}" ${o.dash?`stroke-dasharray="${o.dash}"`:''} stroke-linecap="round" marker-end="url(#${m})"/>`;};
const g=(x,y,s,inner)=>`<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;
const svg=(w,h,inner,o={})=>`<svg viewBox="0 0 ${w} ${h}" width="${o.width||w}" height="${o.height||h}" role="img" aria-label="${o.label||''}">${inner}</svg>`;
const doc=(x,y,label,fill=C.lblue,w=150)=>R(`<path d="M${x} ${y} h${w-22} l22 22 v40 h-${w} z M${x+w-22} ${y} v22 h22"/>`,fill)+T(x+12,y+40,label,{z:15,cls:'mono',w:600});

/* people and agents */
const person=(x,y,s=1)=>g(x,y,s,R('<circle cx="0" cy="-34" r="13"/><path d="M-20 18 Q-20 -16 0 -16 Q20 -16 20 18 Z"/>',C.red));
const robot=(x,y,s=1,fill=C.yellow)=>g(x,y,s,R('<rect x="-17" y="-44" width="34" height="28" rx="6"/><path d="M0 -44 v-9"/><circle cx="0" cy="-56" r="3"/><rect x="-20" y="-12" width="40" height="30" rx="6"/>',fill)+
  `<circle cx="-7" cy="-31" r="3" fill="${C.ink}"/><circle cx="7" cy="-31" r="3" fill="${C.ink}"/>`);

/* tool glyphs, each drawn in a 100 x 100 box */
const GL={
  fascicle:()=>L('<path d="M30 70 Q44 90 57 68 M57 68 Q70 92 79 74 M8 88 Q50 72 94 90 M30 70 Q20 84 12 82"/>',C.brown,2.5)+
    R('<path d="M14 52 Q30 20 46 52 Z"/><path d="M40 46 Q57 10 74 46 Z"/><path d="M66 58 Q79 36 92 58 Z"/>',C.yellow)+
    R('<rect x="27" y="52" width="6" height="18" rx="2"/><rect x="54" y="46" width="6" height="22" rx="2"/><rect x="76" y="58" width="6" height="16" rx="2"/>',C.white,2),
  checkride:()=>R('<path d="M40 14 L60 14 L84 92 L16 92 Z"/>',C.grey)+L('<path d="M50 22 v10 M50 42 v10 M50 62 v12"/>',C.white,3)+
    [[38,30],[34,48],[29,66],[24,84],[62,30],[66,48],[71,66],[76,84]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4.5" fill="${C.green}" stroke="${C.ink}" stroke-width="2"/>`).join(''),
  storium:()=>R('<path d="M20 26 v50 a30 10 0 0 0 60 0 v-50"/><ellipse cx="50" cy="26" rx="30" ry="10"/>',C.lblue)+L('<path d="M20 43 a30 10 0 0 0 60 0 M20 60 a30 10 0 0 0 60 0"/>'),
  keyframes:()=>L('<path d="M6 60 H94"/>',C.ink,3)+[22,50,78].map(x=>R(`<path d="M${x} 46 L${x+13} 60 L${x} 74 L${x-13} 60 Z"/>`,C.yellow,3)).join('')+
    [33,38,43,61,66,71].map(x=>`<circle cx="${x+1}" cy="60" r="2.2" fill="${C.ink}"/>`).join('')+L('<path d="M22 30 v10 M50 30 v10 M78 30 v10"/>',C.red,3),
  storyboard:()=>R('<rect x="8" y="14" width="40" height="30" rx="3"/><rect x="54" y="14" width="40" height="30" rx="3"/><rect x="8" y="52" width="40" height="30" rx="3"/><rect x="54" y="52" width="40" height="30" rx="3"/>',C.white)+
    R('<path d="M60 22 h28 v14 h-18 l-6 6 v-6 h-4 z"/>',C.lyellow,2,2)+T(74,34,'?',{a:'middle',z:13,w:700})+L('<path d="M14 74 l10 -12 l8 8 l10 -14 M60 74 h28 M60 66 h18"/>',C.ink2,2),
  plumbbob:()=>L('<path d="M50 4 V46"/>',C.ink,2.5)+R('<path d="M50 46 L66 62 L50 96 L34 62 Z"/>',C.red)+R('<rect x="42" y="40" width="16" height="8" rx="2"/>',C.yellow,2,2),
  volley:()=>R('<circle cx="22" cy="58" r="14"/><circle cx="78" cy="58" r="14"/>',C.yellow)+L('<path d="M22 72 v18 M78 72 v18"/>')+
    L('<path d="M34 46 Q50 6 66 46"/>',C.ink2,2.5,'stroke-dasharray="4 6"')+R('<circle cx="50" cy="22" r="6"/>',C.white,2,2),
  runciter:()=>R('<path d="M34 94 L40 40 H60 L66 94 Z"/>',C.white)+R('<path d="M26 40 H74 L68 18 H32 Z"/>',C.blue)+L('<path d="M38 26 h24 M44 60 h12 M44 76 h12"/>',C.white,3)+L('<path d="M50 18 V6"/><circle cx="50" cy="5" r="2"/>'),
  atis:()=>L('<path d="M8 84 Q30 66 50 80 T92 76 M14 94 Q40 82 60 92 T94 90"/>',C.brown,2)+R('<circle cx="68" cy="30" r="12"/>',C.yellow)+
    R('<path d="M18 52 a12 12 0 0 1 10 -20 a16 16 0 0 1 30 2 a11 11 0 0 1 8 18 z"/>',C.white)+L('<path d="M30 60 l-4 8 M44 60 l-4 8 M58 60 l-4 8"/>',C.blue,2.5),
  penfield:()=>R('<circle cx="50" cy="54" r="34"/>',C.white)+R('<circle cx="50" cy="54" r="18"/>',C.blue)+L('<path d="M50 54 L64 36"/>',C.white,4)+
    [[50,12],[22,24],[78,24],[12,54],[88,54]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${C.ink}"/>`).join(''),
  lodestar:()=>R('<path d="M50 6 L60 42 L94 50 L60 58 L50 94 L40 58 L6 50 L40 42 Z"/>',C.yellow)+R('<circle cx="50" cy="50" r="6"/>',C.white,2,2),
  shinbun:()=>R('<path d="M12 22 H80 V84 H20 a8 8 0 0 1 -8 -8 Z"/>',C.white)+R('<path d="M80 34 H90 V76 a8 8 0 0 1 -8 8 H20"/>',C.grey,2)+
    L('<path d="M20 34 H72"/>',C.ink,5)+L('<path d="M20 48 H44 M20 56 H44 M20 64 H44 M20 72 H44 M52 48 H72 M52 56 H72 M52 64 H66"/>',C.ink2,2),
  jig:()=>R('<path d="M10 30 H58 L80 52 L58 74 H10 Z"/>',C.lyellow)+R('<circle cx="22" cy="52" r="5"/>',C.white,1,2)+T(44,59,'v1',{a:'middle',z:18,w:700,cls:'mono'})+
    R('<circle cx="76" cy="26" r="15"/>',C.green)+L('<path d="M69 26 l5 5 l9 -10"/>',C.white,3),
  ridgeline:()=>R('<path d="M4 84 L28 44 L40 58 L60 20 L78 50 L96 84 Z"/>',C.white)+L('<path d="M54 30 L60 20 L66 31"/>',C.ink2,2),
  trellis:()=>L('<path d="M20 90 V14 M50 90 V14 M80 90 V14 M8 30 L92 70 M8 70 L92 30"/>',C.brown,3)+R('<circle cx="34" cy="44" r="6"/><circle cx="66" cy="62" r="6"/>',C.green,2,2),
};
const glyph=(name,x,y,s=1)=>g(x,y,s,GL[name]());

/* ------------------------------------------------------------------
   The workshop map. One set of positions drives the full map and the
   small "you are here" map on every tool slide.
------------------------------------------------------------------- */
const LAYERS={
  foundation:{name:'the foundations',where:'in the foundations',col:C.brown},
  builder:{name:'the builders',where:'among the builders',col:'#C98F00'},
  control:{name:'the control tower',where:'in the control tower',col:C.blue},
  around:{name:'built with it',where:'built on the toolchain',col:C.plum},
};
const NODES=[
  {id:'runciter',x:300,y:44,layer:'control',label:'runciter',what:'supervises the work'},
  {id:'atis',x:580,y:44,layer:'control',label:'atis',what:'shows what changed'},
  {id:'penfield',x:860,y:44,layer:'control',label:'penfield',what:'picks the model'},
  {id:'storyboard',x:300,y:256,layer:'builder',label:'storyboard',what:'drafts the first plan'},
  {id:'plumbbob',x:580,y:256,layer:'builder',label:'plumbbob',what:'plans, and stops for you'},
  {id:'volley',x:860,y:256,layer:'builder',label:'volley',what:'builds one step well'},
  {id:'fascicle',x:300,y:470,layer:'foundation',label:'fascicle',what:'agents from plain parts'},
  {id:'checkride',x:510,y:470,layer:'foundation',label:'checkride',what:'says when it is done'},
  {id:'keyframes',x:720,y:470,layer:'foundation',label:'keyframes',what:'writes down why'},
  {id:'storium',x:930,y:470,layer:'foundation',label:'storium',what:'keeps data tidy'},
  {id:'shinbun',x:1185,y:44,layer:'around',label:'shinbun',what:'a daily paper'},
  {id:'lodestar',x:1185,y:256,layer:'around',label:'lodestar',what:'memory that updates'},
  {id:'jig',x:1185,y:470,layer:'around',label:'agent-tools',what:'commit and version'},
];
function workshop(o={}){
  const hi=o.hi, mini=!!o.mini;
  let s='';
  s+=`<rect x="0" y="0" width="1050" height="210" fill="${C.ice}"/>`;

const TOOLS={
fascicle:{kid:'LEGO bricks for agents. Every piece snaps onto every other piece.',
  problem:'Most agent frameworks make you build inside their classes and lifecycle, and tie you to their vendor. Swapping a model or testing a single step means fighting the framework.',
  how:['Every unit is a <code>Step&lt;i, o&gt;</code>: a function, a model call, a tool, or a whole flow.','23 composers (<code>sequence</code>, <code>parallel</code>, <code>branch</code>, <code>retry</code>, <code>loop</code>, <code>checkpoint</code>, ensembles…) take steps and return a step.','One <code>generate</code> call works across eight providers, including local Ollama and <code>claude_cli</code>, which runs a whole Claude Code session as one step.','Adapters such as loggers and checkpoint stores are passed in per run, and every run leaves a JSONL trajectory behind.'],
  io:'Serve any flow over MCP, as an editor agent over ACP, or behind <code>run_stdio</code> as a runciter agent.',
  alone:'pnpm add fascicle\nawait run(sequence([step(\'add\', n => n + 1)]), 1)',
  state:['shipped','npm 0.19.2'],stats:'856 commits since 25 Apr 2026. volley, runciter and lodestar are all built on it.'},
checkride:{kid:'A green light you can trust. When it’s green, the work is done.',
  problem:'An agent says it has finished, but nobody ever agreed what finished means, and the checks are scattered across tools, configs and CI.',
  how:['One command runs every check the repo has: types, lint, structure, dead code, tests, docs, links, spelling, mutation, audit.','Exit 0 means done. Exit 1 means something in the job still fails, even if the last edit was fine. Exit 2 means the run itself broke.','<code>init</code> picks up the tools the repo already uses, then writes the AGENTS.md stanza and the agent hooks for you.','It keeps a baseline of existing findings that can only shrink, enforces module boundaries with ast-grep rules, and ships packs for seven languages.'],
  io:'Writes <code>.check/summary.json</code> (schema version 1), read by plumbbob, volley, runciter’s verify and atis.',
  alone:'pnpm add -D checkride\npnpm exec checkride init\npnpm check',
  state:['shipped','npm 0.25.0'],stats:'515 commits since 11 Jun 2026. It is the gate in about 20 repos, including an outside team’s Nix monorepo.'},
storium:{kid:'Describe a table once, and the checking comes for free.',
  problem:'Every project rebuilds the same validation, sanitising, CRUD and migration scaffolding around its ORM, and the copies drift apart.',
  how:['You write native Drizzle tables and wrap them with <code>defineStore()</code>.','Column notes such as required, readonly and hidden generate the Zod schema, the JSON Schema and a CRUD repository.','Incoming data runs through a filter, transform and validate pipeline.','One CLI handles generate, migrate and seed on Postgres, MySQL and SQLite.'],
  io:'It is the data layer under runciter and lodestar. It is a policy layer that sits on top of an ORM, and doesn’t replace one.',
  alone:'npm install storium\nconst users = db.defineStore(usersTable, {\n  columns: { email: { required: true } } })',
  state:['shipped','npm 0.16.0'],stats:'409 commits. It is a 2026 rewrite of something started in 2022.'},
keyframes:{kid:'Write down why, once. People and agents all work from it.',
  problem:'Intent lives in people’s heads, chat threads and stale READMEs. New people piece it together slowly, and agents never see it at all. AGENTS.md tells them how to work but doesn’t say why.',
  how:['One <code>keyframes.md</code> opens with the intent as prose, followed by short items with IDs: principles, map, constraints, scenarios, decisions and taste.','Items cite each other and agents cite them, like <code>[C3 (one-writer)]</code>.','<code>keyframes check</code> validates structure and every citation, the same way every time.','<code>keyframes context &lt;path&gt;</code> gives a harness only the items that apply to the files it is touching.'],
  io:'<code>check --json</code> (schema version 1) is read by storyboard, runciter’s verify and the planned lookouts.',
  alone:'npx @robmclarty/keyframes init\nnpx @robmclarty/keyframes check',

<span class="k">import</span> { <span class="m">make_synthesizer_step</span> } <span class="k">from</span> <span class="s">&#x27;./stages/synthesizer.js&#x27;</span>

<span class="k">export</span> <span class="k">function</span> <span class="fn">build_flow</span>(engine: <span class="t">Engine</span>, models: <span class="t">FlowModels</span>, env: <span class="t">FlowEnv</span>): <span class="t">Step</span>&lt;<span class="t">CortexRun</span>, <span class="t">IngestReport</span>&gt; {

    <span class="f">step</span>('<span class="n">write_note</span>', (d) =&gt; write_note(env.cortex_root, d)),
  ])

  <span class="k">const</span> synthesize_cluster = <span class="f">checkpoint</span>(
    <span class="f">adversarial</span>({

  )

    <span class="f">step</span>('<span class="n">scan_files</span>', scan_files, { <span class="p">description</span>: <span class="d">&#x27;walk and hash&#x27;</span> }),
    <span class="f">map</span>({ <span class="p">name</span>: '<span class="n">ingest_all</span>', <span class="p">items</span>: (s) =&gt; s.files, <span class="p">do</span>: ingest_file, <span class="p">concurrency</span>: <span class="nm">4</span>, <span class="p">description</span>: <span class="d">&#x27;4 at a time&#x27;</span> }),

    <span class="f">step</span>('<span class="n">regen_views</span>', regen_views),

          <span class="p">concurrency</span>: <span class="nm">2</span>, <span class="p">description</span>: <span class="d">&#x27;2 at a time&#x27;</span> }),
  ])
}</pre></div>

      <tr><td>Plain words</td><td><b>volley</b>: the back-and-forth of builder and critic. <b>lodestar</b>: the star you steer by. <b>shinbun</b> (新聞): Japanese for newspaper. <b>storium</b>: storage with a suffix. <b>ridgeline</b>: the long high route you commit to.</td></tr>
    </table>
  </div><div class="num"></div></section>`);

/* ------------------------------------------------------------------
   Deck mechanics.
------------------------------------------------------------------- */
/* ------------------------------------------------------------------
   The running order. Slides are defined above in any order; these two
   lists decide what is shown and where. MAIN is the talk. APPENDIX
   comes after the close, for questions and for readers.
------------------------------------------------------------------- */
const MAIN=['Title','The problem','The idea','The workshop map','Where it came from','Waves and weaves','The tools',
  'fascicle','checkride','keyframes','storyboard','plumbbob','volley','runciter','atis','Also in the workshop',
  'Composed: the long-horizon builder','The contracts','What I learned','Where it stands','Ways in','Close'];
const APPENDIX=['Composed: one step up close','Composed: a flow you can read','Who owns what','The plugs','Why not something off the shelf','A year',
  'storium','penfield','lodestar','shinbun','agent-tools','Appendix: the names'];
const BY_TITLE=Object.fromEntries(S.map(h=>[h.match(/data-title="([^"]*)"/)[1],h]));
const pick=t=>{if(!BY_TITLE[t])throw new Error('No slide titled '+t);return BY_TITLE[t];};
S.length=0;
MAIN.forEach(t=>S.push(pick(t)));
APPENDIX.forEach(t=>S.push(pick(t).replace('<section class="slide','<section data-appendix="1" class="slide')));

const deck=document.getElementById('deck');
deck.innerHTML=S.join('');
const slides=[...deck.querySelectorAll('.slide')];
const mainCount=slides.filter(s=>!s.dataset.appendix).length;
slides.forEach((s,i)=>{const n=s.querySelector('.num'),ax=s.dataset.appendix; if(n) n.textContent=ax?`appendix ${i+1-mainCount}`:`${i+1} / ${mainCount}`;
  if(ax) s.insertAdjacentHTML('beforeend','<div class="apx">Appendix</div>');});
let cur=0;
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  history.replaceState(null,'','#'+(cur+1));document.title=`${slides[cur].dataset.title} · Build with AI, stay in charge`;}
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);deck.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(cur+1);}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(cur-1);}
  else if(e.key==='Home')show(0); else if(e.key==='End')show(slides.length-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
deck.addEventListener('click',e=>{if(e.target.closest('a,.hood'))return;const r=deck.getBoundingClientRect();(e.clientX-r.left)>r.width/2?show(cur+1):show(cur-1);});
show(parseInt(location.hash.slice(1)||'1',10)-1);
</script>
